<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine's Surprise</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .card, .envelope, .message {
      display: none;
      text-align: center;
      padding: 30px;
      border-radius: 15px;
      background: #f68888;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      max-width: 3504px;
      animation: fadeIn 1s ease forwards;
      position: relative;
      z-index: 2;
    }

    .card.active, .envelope.active, .message.active {
      display: block;
    }

    h2 {
      color: #e63946;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      background: #e63946;
      color: #1e1112;
      font-size: 20px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #d62828;
    }

    .decor {
      font-size: 28px;
      margin-top: 15px;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.9);}
      to {opacity: 1; transform: scale(1);}
    }

    .heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 24px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card active" id="letter">
    <h2>To lablab💖</h2>
    <button onclick="showEnvelope()">Open Letter</button>
  </div>

  <div class="envelope" id="envelope">
    <h2>📩 A Special Envelope</h2>
    <p>Click to see what's inside!</p>
    <button onclick="showMessage()">Open Envelope</button>
  </div>

 
  <div class="message" id="message">
    <h2> Hi lablab ❤️</h2>
    <p>
      <br>
      Happy Valentine''s 💕 Imissyouusomuch huhuhu.
       Iloveyouuuu and I'm always proud of youuu mwaaa!💗
    </p>
    <div class="decor">🌸💖🌹💞🌺</div>
  </div>


  <script>
    function showEnvelope() {
      document.getElementById('letter').classList.remove('active');
      document.getElementById('envelope').classList.add('active');
    }

    function showMessage() {
      document.getElementById('envelope').classList.remove('active');
      document.getElementById('message').classList.add('active');
    }

   
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '❤';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (4 + Math.random() * 3) + 's';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(createHeart, 500);
  </script>

</body>
</html>
